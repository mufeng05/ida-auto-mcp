[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ida-auto-mcp"
version = "1.2.0"
description = "Headless IDA Pro MCP server - automated binary analysis for AI agents"
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "mufeng05" }]
keywords = ["ida", "ida-pro", "idalib", "mcp", "reverse-engineering", "decompiler"]
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Disassemblers",
]
# Hex-Rays' loader for IDA's idalib; it finds IDA through IDADIR
dependencies = ["idapro"]

[project.urls]
Repository = "https://github.com/mufeng05/ida-auto-mcp"
Issues = "https://github.com/mufeng05/ida-auto-mcp/issues"

[project.scripts]
ida-auto-mcp = "ida_auto_mcp.server:main"
